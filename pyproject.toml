[project]
name = "cyber-deception-framework"
version = "0.1.0"
description = "Adaptive AI-Based Cyber Deception Framework for Zero Trust Enterprise Networks"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.1",
    "sqlalchemy==2.0.36",
    "alembic==1.13.2",
    "aiosqlite==0.20.0",
    "asyncpg==0.29.0",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "structlog==24.4.0",
    "httpx==0.27.2",
    "python-multipart==0.0.9",
    "scikit-learn==1.5.2",
    "xgboost==2.1.4",
    "torch==2.5.1",
    "shap==0.46.0",
    "joblib==1.4.2",
    "gymnasium==0.29.0",
    "stable-baselines3==2.3.2",
    "flwr==1.13.1",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "ml*", "scripts*", "federated*", "experiments*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
